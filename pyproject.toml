[project]
name = "tailorbuy"
version = "0.1.0"
description = "Application that uses AI to find best buy products, by user prefferences."
authors = [
    {name = "Ionut Cristian Vinte",email = "vinteionut@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.3,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "google-generativeai (>=0.8.6,<0.9.0)",
    "tenacity (>=9.1.4,<10.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
